<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Acentos e emojis -->
    <meta charset="UTF-8">
    <!-- Ajusta p/ celular e tablet -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Nome na aba -->
    <title>Jogo das Letras</title>
    <!-- Liga o CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Jogo das Letras</h1>

        <!-- Pontos e erros -->
        <p id="pontos">Pontos: 0 | Erros: 0</p>

        <!-- Tempo -->
        <p id="tempo"></p>

        <!-- Desenho do animal -->
        <div id="animal">🐒</div>

        <!-- Pergunta -->
        <p id="pergunta">Com que letra começa o nome deste animal?</p>

        <!-- Botões das letras -->
        <div id="opcoes"></div>

        <!-- Pausar, escondido até começar -->
        <button id="botao-pausar" class="botao-recomecar" hidden>Pausar</button>

        <!-- Acertou ou errou -->
        <p id="mensagem"></p>

        <!-- Caixinha do nome -->
        <div id="caixa-nome"></div>

        <!-- Ranking -->
        <div id="ranking"></div>
    </main>

    <!-- No final p/ o JS rodar dps da pág carregar -->
    <script src="script.js"></script>
</body>

</html>
